name: Build PJS110 Kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: oppo-source/android_kernel_oppo_mt6833
          ref: oppo/mt6833_t_13.1.1_a2x_5g
          fetch-depth: 1

      - name: Vendor tarball + kernel-4.19 symlink
        run: |
          set -u
          PARENT=$(dirname "$GITHUB_WORKSPACE")
          cd "$PARENT"
          curl -sL -o vendor.tar.gz \
            https://github.com/wf200866/pjs110-kernel-build/releases/download/vendor-v1/vendor.tar.gz
          tar xzf vendor.tar.gz
          rm -f vendor.tar.gz
          du -sh "$PARENT/vendor" || true
          [ -e kernel-4.19 ] || ln -s "$(basename "$GITHUB_WORKSPACE")" kernel-4.19
          cd "$GITHUB_WORKSPACE"
          test -f kernel/sched_assist/Kconfig && echo "  OK sched_assist" || echo "  BREAK sched_assist"
          test -f include/linux/sched_assist/sched_assist_binder.h && echo "  OK binder.h" || echo "  BREAK binder.h"

      - name: Fetch build config (B)
        run: |
          curl -sL -o /tmp/buildB.config \
            https://github.com/wf200866/pjs110-kernel-build/releases/download/vendor-v1/buildB.config
          wc -l /tmp/buildB.config
          md5sum /tmp/buildB.config
          echo "  expect md5: 5b277bddc1806a2615843ada5ce8c4da"
          echo "--- key items ---"
          grep -E '^CONFIG_(MODULE_SIG|MODVERSIONS|MODULE_UNLOAD|CLANG_VERSION)=' /tmp/buildB.config
          grep -E '^CONFIG_(LTO|CFI|THINLTO)' /tmp/buildB.config || echo "  (LTO/CFI all off - good)"

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make libncurses-dev flex bison libssl-dev bc \
                                    cpio lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu openssl
          set -e
          # clang 14 实测两条路都翻车：
          #   14.0.0/14.0.6 编这棵 4.19 MTK 树 → kernel/bounds.s 直接炸
          #     (atomic_ll_sc.h: unknown type name 'atomic64_t')，20 errors
          # clang 11.0.1 (r383902) 是 v5 五次成功构建的同款工具链，实测能编完这棵树
          # 承重墙是 config 里的 MODULE_SIG/CFI/LTO 开关（已锁定），编译器版本不影响
          # struct module 布局，也不进 vermagic
          CLANG_DIR="$HOME/clang-r383902"
          rm -rf "$CLANG_DIR"
          echo "  fetching clang 11.0.1 (r383902, v5-proven)..."
          if git clone --depth 1 --branch lineage-20 \
               https://github.com/Jacksonzwang/android_prebuilts_clang_kernel_linux-x86_clang-r383902.git \
               "$CLANG_DIR" 2>&1 | tail -3; then
            echo "  [ok] clone done"
          else
            echo "  [warn] clone failed, trying tarball"
            mkdir -p "$CLANG_DIR"
            curl -sL --max-time 600 -o /tmp/clang.tar.gz \
              "https://github.com/Jacksonzwang/android_prebuilts_clang_kernel_linux-x86_clang-r383902/archive/refs/heads/lineage-20.tar.gz"
            tar xzf /tmp/clang.tar.gz -C "$CLANG_DIR" --strip-components=1
          fi
          test -x "$CLANG_DIR/bin/clang" || { echo "!! no bin/clang"; exit 1; }
          test -x "$CLANG_DIR/bin/ld.lld" || { echo "!! no bin/ld.lld"; exit 1; }
          echo "$CLANG_DIR/bin" >> $GITHUB_PATH
          "$CLANG_DIR/bin/clang" --version | head -2

      - name: Patch kernel source
        run: |
          set -u
          cd "$GITHUB_WORKSPACE"
          fail=0

          echo "===== A. build hygiene (warnings only, no behavior change) ====="
          grep -rl -- "-Werror" --include=Makefile --include=Kbuild --include="*.mk" . 2>/dev/null | while read -r f; do
            sed -i 's/-Werror=/-Wno-error=/g; s/-Werror-\([A-Za-z0-9_-]*\)/-Wno-error=\1/g; s/\(^\|[[:space:]]\)-Werror\([[:space:]]\|$\)/\1-Wno-error\2/g' "$f"
          done
          for f in $(grep -rl -- '-fmerge-constants' . --include=Makefile --include='*.mk' --include=Kbuild 2>/dev/null); do
            sed -i 's/-fmerge-constants//g' "$f"
          done
          echo "  [ok]"

          echo "===== B. check_version bypass ====="
          echo '' | base64 -d > /tmp/patch_modver.py
          python3 /tmp/patch_modver.py || fail=1
          echo "  marker count: $(grep -c 'PJS110_VENDOR_KO_BYPASS' kernel/module.c || echo 0)"

          echo "===== C. fix dangling Kconfig sources ====="
          echo '' | base64 -d > /tmp/fix_dangling_kconfig.py
          python3 /tmp/fix_dangling_kconfig.py 2>&1 | tail -30 || true

          echo "===== D. v5 defect fixes (proven in v5's 5 successful builds) ====="
          V="$(dirname "$GITHUB_WORKSPACE")/vendor"

          # D1. oppo_process.h 桩：kernel/exit.c include 了它，vendor 不提供
          mkdir -p include/soc/oplus/system
          PROC_H="include/soc/oplus/system/oppo_process.h"
          if [ -L "$PROC_H" ]; then rm -f "$PROC_H"; fi
          printf '%s\n' \
            '#ifndef _OPPO_PROCESS_H_' \
            '#define _OPPO_PROCESS_H_' \
            '#include <linux/types.h>' \
            '#include <linux/sched.h>' \
            '#include <linux/pid.h>' \
            '#include <linux/string.h>' \
            'static inline bool is_key_process(struct task_struct *t)' \
            '{' \
            '    if (!t) return false;' \
            '    if (!strcmp(t->comm, "init") || !strcmp(t->comm, "system_server")' \
            '        || !strcmp(t->comm, "surfaceflinger")' \
            '        || !strcmp(t->comm, "servicemanager"))' \
            '        return true;' \
            '    return false;' \
            '}' \
            'static inline bool oppo_is_android_core_group(struct pid *pgrp) { return false; }' \
            '#endif' > "$PROC_H"
          echo "  [ok] oppo_process.h stub ($(wc -c < "$PROC_H") bytes)"

          # D2. vendor inline 降级（always_inline body-not-available 修复）
          echo '' | base64 -d > /tmp/inline_fix.py
          python3 /tmp/inline_fix.py "$V" 2>&1 | tail -4 || true

          # D3. 孤儿 Kconfig 定向补 source（touchpanel/OPLUS/f2fs 特性符号可达性）
          echo '' | base64 -d > /tmp/fix_kconfig.py
          python3 /tmp/fix_kconfig.py 2>&1 | tail -15 || true

          # D4. oplus system 子系统接线（OPROJECT/FEEDBACK 在 buildB 里是 y）
          SOCMK="drivers/soc/oplus/Makefile"
          if [ -f "$SOCMK" ] && ! grep -q 'healthinfo/' "$SOCMK" 2>/dev/null; then
            printf 'obj-y += healthinfo/\n' >> "$SOCMK"
            echo "  [ok] soc/oplus/Makefile + healthinfo"
          fi
          SYSKC="drivers/soc/oplus/system/Kconfig"
          if [ -f "$SYSKC" ]; then
            for sub in $(ls -d drivers/soc/oplus/system/*/ 2>/dev/null); do
              name=$(basename "$sub")
              [ -f "$sub/Kconfig" ] || continue
              rel="drivers/soc/oplus/system/$name/Kconfig"
              grep -q "$rel" "$SYSKC" || printf 'source "%s"\n' "$rel" >> "$SYSKC"
            done
            echo "  [ok] system/Kconfig subdirs sourced"
          fi
          rm -f include/soc/oplus/system/oppo_project.h include/soc/oplus/system/oplus_project.h
          SRC_PJ="$V/oplus/kernel/boot/include/oplus_project.h"
          [ -f "$SRC_PJ" ] || SRC_PJ="$V/oplus/kernel/system/include/oplus_project.h"
          if [ -f "$SRC_PJ" ]; then
            ln -sf "$SRC_PJ" include/soc/oplus/system/oplus_project.h
            ln -sf "$SRC_PJ" include/soc/oplus/system/oppo_project.h
            echo "  [ok] oplus_project.h linked"
          fi
          [ -f include/scp.h ] || printf '%s\n' '#ifndef _SCP_FORWARD_H_' \
            '#define _SCP_FORWARD_H_' \
            '#include <../drivers/misc/mediatek/scp/include/scp.h>' \
            '#endif' > include/scp.h

          # D5. 核心 4 处 inline 声明修正
          sed -i 's/^extern inline bool handle_chp_ext_cmd/extern bool handle_chp_ext_cmd/' include/linux/mm.h 2>/dev/null || true
          sed -i 's/^inline void uclamp_se_set/extern void uclamp_se_set/' kernel/sched/sched.h 2>/dev/null || true
          sed -i 's/^inline void ksm_flock/extern void ksm_flock/' include/linux/keyslot-manager.h 2>/dev/null || true
          sed -i 's/^inline void blk_crypto_flock/extern void blk_crypto_flock/' include/linux/blk-crypto.h 2>/dev/null || true

          # D6. futex.c：vendor 不提供 locking_vh_*_handler，屏蔽调用点
          #     （LOCKING_STRATEGY 保持 y，mutex_list_add 由 sched_assist 提供）
          FUTEX_C="kernel/futex.c"
          if [ -f "$FUTEX_C" ]; then
            sed -i 's/^#if IS_ENABLED(CONFIG_OPLUS_LOCKING_STRATEGY)$/#if 0 \/* pjs110: vendor handler missing *\//' "$FUTEX_C"
            echo "  [ok] futex.c handler calls masked (left: $(grep -c 'IS_ENABLED(CONFIG_OPLUS_LOCKING_STRATEGY)' "$FUTEX_C" || echo 0))"
          fi

          # D7. tp_devices.h 补 TP_VXN（touch.c 引用，v5 实测缺陷）
          for TP in drivers/input/touchscreen/tp_devices.h \
                    "$V/oplus/kernel/touchpanel/oplus_touchscreen/tp_devices.h"; do
            if [ -f "$TP" ] && ! grep -q 'TP_VXN' "$TP"; then
              awk 'done==0 && /TP_TXD,[ ]*$/ { print; n=$0; gsub(/TP_TXD/,"TP_VXN",n); print n; done=1; next } { print }' \
                "$TP" > /tmp/tp.new && mv /tmp/tp.new "$TP"
              echo "  [ok] $TP: TP_VXN $(grep -c TP_VXN "$TP")"
            fi
          done

          # D8. sensor_devinfo.c 空参数补原型（v5 实测缺陷）
          for SDI in "$V/oplus/sensor/kernel/oplus_sensor_devinfo/sensor_devinfo.c" \
                     "$V/oplus/sensor/kernel/sensorhub/oplus_sensor_devinfo/sensor_devinfo.c"; do
            if [ -f "$SDI" ] && ! grep -q 'register_lcdinfo_notifier(struct notifier_block' "$SDI"; then
              sed -i 's/^__attribute__((weak)) int register_lcdinfo_notifier() {/__attribute__((weak)) int register_lcdinfo_notifier(struct notifier_block *nb) {/' "$SDI"
              sed -i 's/^__attribute__((weak)) int unregister_lcdinfo_notifier() {/__attribute__((weak)) int unregister_lcdinfo_notifier(struct notifier_block *nb) {/' "$SDI"
              echo "  [ok] sensor_devinfo prototype fixed: $SDI"
            fi
          done

          # D9. sy6529 运算优先级括号（v5 实测缺陷）
          SY="$V/oplus/kernel/charger/v1/voocphy/oplus_sy6529.c"
          if [ -f "$SY" ]; then
            sed -i 's/if (\*data == sy6529_CHARGE_MODE_2_1 | \*data == sy6529_CHARGE_MODE_1_1)/if ((*data == sy6529_CHARGE_MODE_2_1) | (*data == sy6529_CHARGE_MODE_1_1))/' "$SY"
            echo "  [ok] sy6529 parens fixed"
          fi

          # D10. imgsensor 死引用：给缺 Makefile 的传感器目录建空桩
          #      v2 教训：引用可能藏在 .mk / 非标准名文件里，--include=Makefile 漏网
          #      v3：扫 $DS 下所有文本文件的 v1_1/NAME 引用，缺就建空桩
          #      空 Makefile = 目录可进入但什么都不编，零副作用
          DS=drivers/misc/mediatek/imgsensor/src
          mkdir -p "$DS/common/v1_1" 2>/dev/null
          for name in $(grep -rhoE 'v1_1/[A-Za-z0-9_]+' "$DS" 2>/dev/null | sed 's|^.*v1_1/||' | sort -u); do
            [ -n "$name" ] || continue
            if [ ! -f "$DS/common/v1_1/$name/Makefile" ]; then
              mkdir -p "$DS/common/v1_1/$name"
              : > "$DS/common/v1_1/$name/Makefile"
              echo "  [ok] imgsensor stub: $name"
            fi
          done
          # 兜底：直接针对已知缺失项（v7 三轮实测）
          for name in ov16a1q_mipi_raw_hawaii; do
            if [ ! -f "$DS/common/v1_1/$name/Makefile" ]; then
              mkdir -p "$DS/common/v1_1/$name"; : > "$DS/common/v1_1/$name/Makefile"
              echo "  [ok] imgsensor stub (hardcoded): $name"
            fi
          done

          [ "$fail" -eq 0 ] && echo "PATCH OK" || { echo "!! patch failed"; exit 1; }

      - name: Build
        run: |
          export PATH="$HOME/clang-r383902/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          clang --version | head -3

          mkdir -p out
          cp /tmp/buildB.config out/.config
          echo "--- .config ---"
          md5sum out/.config
          grep -c '^CONFIG_' out/.config

          # MODULE_SIG_ALL 关掉：不需要给模块签名，省掉现场生成密钥
          if grep -q '^CONFIG_MODULE_SIG_ALL=' out/.config; then
            sed -i 's/^CONFIG_MODULE_SIG_ALL=.*/# CONFIG_MODULE_SIG_ALL is not set/' out/.config
          fi
          # MODULE_SIG_FORCE 必须关，否则无签名 vendor ko 一律拒载
          if grep -q '^CONFIG_MODULE_SIG_FORCE=' out/.config; then
            sed -i 's/^CONFIG_MODULE_SIG_FORCE=.*/# CONFIG_MODULE_SIG_FORCE is not set/' out/.config
          fi

          # f2fs 压缩：原厂 stock 没开（# CONFIG_F2FS_FS_COMPRESSION is not set），
          # bootable 那版的树配平了 compress.c，当前 vendor 没带配平 → 关掉，零风险
          for S in F2FS_FS_COMPRESSION F2FS_FS_LZO F2FS_FS_LZ4 F2FS_FS_ZSTD; do
            sed -i "s/^CONFIG_${S}=.*/# CONFIG_${S} is not set/" out/.config
          done

          # vermagic 的 '+'：原厂 ko 是 4.19.191+，LOCALVERSION 留空让脏树自动补 +
          if grep -q '^CONFIG_LOCALVERSION=' out/.config; then
            sed -i 's|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=""|' out/.config
          fi

          echo "--- MODULE_SIG family ---"
          grep -E 'CONFIG_MODULE_SIG' out/.config

          # v7 教训：make 输出全吞进 /tmp/build.log 导致盲飞 6 小时。
          # 现在：tee 实时进 Actions 日志 + 后台看门狗（5 分钟无进展就杀 make，快速失败）
          KCF="-I$PWD/drivers/misc/mediatek/scp/include -I$PWD/drivers/misc/mediatek/include -Wno-error=date-time -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=declaration-after-statement -Wno-error=inline -Wno-error=maybe-uninitialized -Wno-error=parentheses -Wno-error=unused-function -Wno-error=unused-label -Wno-error=switch -Wno-error=tautological-compare -Wno-error=memset-elt-size -Wno-error=misleading-indentation -Wno-error=sizeof-pointer-memaccess -Wno-error=stringop-truncation -Wno-error=address-of-packed-member -Wno-error=pointer-to-int-cast -Wno-error=int-to-pointer-cast -Wno-error=stringop-overread -Wno-error=stringop-overflow -Wno-error=array-bounds -Wno-error=unused-result -Wno-error=missing-braces -Wno-error=builtin-declaration-mismatch -Wno-error=ignored-optimization-argument -Wno-ignored-optimization-argument -Wno-error=unknown-warning-option -Wno-unknown-warning-option -Wno-error=unused-command-line-argument -Wno-unused-command-line-argument"
          export KCFLAGS="$KCF"

          echo "=== watchdog start ==="
          ( START=$(date +%s)
            HAVE=0; LASTNEW=0; i=0
            while true; do
              sleep 60
              i=$((i+1))
              ALL=$(find out -name '*.o' 2>/dev/null | wc -l)
              BUSY=$(pgrep -c 'clang|ld.lld' 2>/dev/null || true)
              echo "[watchdog] min=$i total_o=$ALL busy(compiler/linker)=$BUSY"
              if [ "$ALL" -gt "$HAVE" ]; then HAVE=$ALL; LASTNEW=$i; fi
              ELAPSED=$(( $(date +%s) - START ))
              if [ "$BUSY" -eq 0 ]; then
                IDLE=$(( i - LASTNEW ))
                if { [ "$HAVE" -gt 0 ] && [ "$IDLE" -ge 5 ]; } || \
                   { [ "$HAVE" -eq 0 ] && [ "$ELAPSED" -gt 900 ]; }; then
                  echo "[watchdog] STALLED (idle_min=$IDLE elapsed_s=$ELAPSED) - dump and kill"
                  ps -eo pid,ppid,etime,comm,args --sort=-etime | head -25 || true
                  echo "[watchdog] --- build.log tail ---"
                  tail -5 /tmp/build.log 2>/dev/null || true
                  pkill -9 make || true
                  pkill -9 bc   || true
                  pkill -9 sh   || true
                  pkill -9 clang || true
                  break
                fi
              fi
            done ) &
          WD_PID=$!

          set +e
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               CC="clang --target=aarch64-linux-gnu" \
               LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
               -j$(nproc) Image.gz 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          set -e
          kill $WD_PID 2>/dev/null || true

          echo "=== BUILD EXIT: $RC ==="
          grep -E "error:|fatal error:" /tmp/build.log | head -60 || true
          echo "=== last 30 ==="
          tail -30 /tmp/build.log || true
          ls -la out/arch/arm64/boot/ 2>&1 | head -20 || true
          [ "$RC" -eq 0 ] || exit 1

      - name: Verify
        run: |
          echo '' | base64 -d > /tmp/verify.py
          echo "===== verify ====="
          python3 /tmp/verify.py out/arch/arm64/boot/Image
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo ""
            echo "!! verification failed - not shipping"
            exit 1
          fi

      - name: Package
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd out/arch/arm64/boot 2>/dev/null || { echo "no boot dir"; exit 0; }
          if [ -f Image.gz ]; then
            cp Image.gz "$GITHUB_WORKSPACE/artifacts/kernel_Image.gz"; echo "Image.gz"
          elif [ -f Image ]; then
            gzip -9 -c Image > "$GITHUB_WORKSPACE/artifacts/kernel_Image.gz"
            cp Image "$GITHUB_WORKSPACE/artifacts/kernel_Image.raw"; echo "gzipped Image"
          else
            echo "!! no image"
          fi
          [ -f out/.config ] && cp out/.config "$GITHUB_WORKSPACE/artifacts/out.config" || true
          [ -f .config ] && cp .config "$GITHUB_WORKSPACE/artifacts/out2.config" || true
          ls -la "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjs110-kernel-v7
          path: ${{ github.workspace }}/artifacts/*
          if-no-files-found: warn
