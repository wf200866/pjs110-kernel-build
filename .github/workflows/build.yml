name: Build PJS110 Kernel (Droidspaces + Magisk)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: oppo-source/android_kernel_oppo_mt6833
          ref: oppo/mt6833_t_13.1.1_a2x_5g

      - name: Install cross toolchain (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc-aarch64-linux-gnu make libncurses-dev flex bison libssl-dev bc

      - name: Apply Droidspaces config + fix OPPO/MTK module loading
        run: |
          # 1) Droidspaces config
          cat >> arch/arm64/configs/k6833v1_64_k419_defconfig << 'EOF'

          # DroidSpaces (non-GKI 4.19)
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NF_CONNTRACK_IPV6=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_MACVLAN=y
          CONFIG_USER_NS=y
          CONFIG_NETFILTER_XT_MATCH_COMMENT=y
          CONFIG_NETFILTER_XT_MATCH_STATE=y
          CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
          CONFIG_NETFILTER_XT_MATCH_MULTIPORT=y
          CONFIG_NETFILTER_XT_MATCH_HL=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_IP_NF_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_IP_NF_TARGET_ULOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_NETFILTER_XT_MATCH_LIMIT=y
          CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=y
          CONFIG_NETFILTER_XT_MATCH_OWNER=y
          CONFIG_NETFILTER_XT_MATCH_PKTTYPE=y
          CONFIG_NETFILTER_XT_MATCH_MARK=y
          CONFIG_NETFILTER_XT_TARGET_MARK=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_NETFILTER_NETLINK_QUEUE=y
          CONFIG_NETFILTER_NETLINK_LOG=y
          CONFIG_NETFILTER_XT_TARGET_NFLOG=y
          EOF

          # 2) 关闭 OPPO 闭源模块 feature
          DEF=arch/arm64/configs/k6833v1_64_k419_defconfig
          sed -i 's/CONFIG_OPLUS_FEATURE_LOWMEM_DBG=y/# CONFIG_OPLUS_FEATURE_LOWMEM_DBG is not set/' $DEF
          sed -i 's/CONFIG_OPLUS_HEALTHINFO=y/# CONFIG_OPLUS_HEALTHINFO is not set/' $DEF
          sed -i 's/CONFIG_OPLUS_FEATURE_SCHED_ASSIST=y/# CONFIG_OPLUS_FEATURE_SCHED_ASSIST is not set/' $DEF
          sed -i 's/CONFIG_OPLUS_FEATURE_CPU_JANKINFO=y/# CONFIG_OPLUS_FEATURE_CPU_JANKINFO is not set/' $DEF
          sed -i 's/CONFIG_OPLUS_FEATURE_MEMLEAK_DETECT=y/# CONFIG_OPLUS_FEATURE_MEMLEAK_DETECT is not set/' $DEF
          sed -i 's/CONFIG_OPLUS_FEATURE_TASK_CPUSTATS=y/# CONFIG_OPLUS_FEATURE_TASK_CPUSTATS is not set/' $DEF
          sed -i 's/CONFIG_KMALLOC_DEBUG=y/# CONFIG_KMALLOC_DEBUG is not set/' $DEF
          sed -i 's/CONFIG_VMALLOC_DEBUG=y/# CONFIG_VMALLOC_DEBUG is not set/' $DEF

      - name: Auto-fix missing Kconfig refs (loop until config passes)
        run: |
          set +e
          for i in $(seq 1 300); do
            make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- k6833v1_64_k419_defconfig > /tmp/cfg_loop.log 2>&1
            code=$?
            if [ $code -eq 0 ]; then
              echo "CONFIG_OK round=$i"
              break
            fi
            missing=$(grep -oE "can't open file \"[^\"]+\"" /tmp/cfg_loop.log | head -1 | sed "s/can't open file \"//; s/\"$//")
            if [ -z "$missing" ]; then
              echo "NO_MISSING_FILE_FOUND"
              tail -40 /tmp/cfg_loop.log
              exit 1
            fi
            echo "round=$i missing=$missing"
            grep -rlF "$missing" --include=Kconfig . 2>/dev/null | while read -r f; do
              sed -i "\\|$missing|d" "$f"
            done
            rm -f out/.config
          done

      - name: Remove dangling OPPO symlinks (point to vendor, not present)
        run: |
          git ls-files -s | grep "^120000" | awk '{print $4}' | while read -r link; do
            target=$(readlink "$link" 2>/dev/null)
            if [ -n "$target" ] && (echo "$target" | grep -q "vendor" || [ ! -e "$link" ]); then
              echo "removing symlink: $link -> $target"
              rm -f "$link"
            fi
          done
          echo "symlinks cleaned"

          # 3) 关闭模块签名强制校验（OPPO 私钥不可得，否则 vendor .ko 拒载）
          sed -i '/CONFIG_MODULE_SIG=y/c\CONFIG_MODULE_SIG=n' arch/arm64/configs/k6833v1_64_k419_defconfig
          sed -i '/CONFIG_MODULE_SIG_FORCE=y/c\CONFIG_MODULE_SIG_FORCE=n' arch/arm64/configs/k6833v1_64_k419_defconfig
          sed -i '/CONFIG_MODULE_SIG_ALL=y/c\CONFIG_MODULE_SIG_ALL=n' arch/arm64/configs/k6833v1_64_k419_defconfig

          # 4) 注释掉 MTK 强制 MODVERSIONS（否则 vendor .ko 的 CRC 对不上）
          sed -i 's/^\tselect MODVERSIONS$/\t# select MODVERSIONS (disabled for vendor .ko compat)/' drivers/misc/mediatek/Kconfig.default

      - name: Build kernel
        run: |
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            k6833v1_64_k419_defconfig
          # 确认关键配置已生效
          grep -E "CONFIG_MODVERSIONS|CONFIG_MODULE_SIG|CONFIG_SYSVIPC|CONFIG_OVERLAY_FS|CONFIG_USER_NS" out/.config
          make O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz