name: Build PJS110 Kernel (clang + LTO + CFI)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: oppo-source/android_kernel_oppo_mt6833
          ref: oppo/mt6833_t_13.1.1_a2x_5g
          fetch-depth: 1

      - name: Vendor + kernel-4.19 symlink
        run: |
          set -u
          PARENT=$(dirname "$GITHUB_WORKSPACE")
          cd "$PARENT"
          curl -sL -o vendor.tar.gz \
            https://github.com/wf200866/pjs110-kernel-build/releases/download/vendor-v1/vendor.tar.gz
          tar xzf vendor.tar.gz
          rm -f vendor.tar.gz
          du -sh "$PARENT/vendor" || true
          [ -e kernel-4.19 ] || ln -s "$(basename "$GITHUB_WORKSPACE")" kernel-4.19
          cd "$GITHUB_WORKSPACE"
          test -f kernel/sched_assist/Kconfig && echo "  OK sched_assist" || echo "  BREAK sched_assist"
          test -f include/linux/sched_assist/sched_assist_binder.h && echo "  OK binder.h" || echo "  BREAK binder.h"

      - name: Stock config
        run: |
          curl -sL -o /tmp/stock.config \
            https://github.com/wf200866/pjs110-kernel-build/releases/download/vendor-v1/pjs110_stock.config
          wc -l /tmp/stock.config

      - name: Toolchain - AOSP clang r383902
        run: |
          set -e
          echo "=== 下载 AOSP clang r383902 (clang 11.0.1，与原厂一致) ==="
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          curl -sL -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz"
          ls -la clang.tar.gz
          tar xzf clang.tar.gz -C "$HOME/clang"
          rm -f clang.tar.gz
          echo "=== 版本确认 ==="
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/ld.lld" --version
          echo "=== 依赖 ==="
          sudo apt-get update -qq
          sudo apt-get install -y -qq make libncurses-dev flex bison libssl-dev bc \
                                    gcc-aarch64-linux-gnu cpio python3 zstd

      - name: Patch OPPO source defects (仅文件缺失/语法错误)
        run: |
          set -u
          V="$(dirname "$GITHUB_WORKSPACE")/vendor"
          fail=0
          ok()  { if [ "$1" = "0" ]; then echo "  [ok]   $2"; else echo "  [FAIL] $2"; fail=1; fi; }

          echo "===== A. fs/proc/Kconfig 缺 cpu_jankinfo ====="
          sed -i '/cpu_jankinfo\/Kconfig/d' fs/proc/Kconfig
          ok $? "去掉 cpu_jankinfo 引用"

          echo "===== A2. core 头文件 always_inline 无 body（与编译器无关，clang 也报）====="
          sed -i 's/^extern inline bool handle_chp_ext_cmd/extern bool handle_chp_ext_cmd/' include/linux/mm.h
          ok $? "mm.h handle_chp_ext_cmd"
          sed -i 's/^inline void uclamp_se_set/extern void uclamp_se_set/' kernel/sched/sched.h
          ok $? "sched.h uclamp_se_set"
          sed -i 's/^inline void ksm_flock/extern void ksm_flock/' include/linux/keyslot-manager.h 2>/dev/null || true
          sed -i 's/^inline void blk_crypto_flock/extern void blk_crypto_flock/' include/linux/blk-crypto.h 2>/dev/null || true
          grep -n 'handle_chp_ext_cmd' include/linux/mm.h | head -3
          grep -n 'uclamp_se_set' kernel/sched/sched.h | head -3

          echo "===== A3. vendor 侧 always_inline 无 body（clang 下同样报）====="
          # is_audio_task: 声明 extern inline，定义是 inline（gnu89/clang 都不发射外部符号）
          BINDER="$V/oplus/kernel/oplus_performance/sched_assist/sched_assist_binder.h"
          SAC="$V/oplus/kernel/oplus_performance/sched_assist/sched_assist_common.c"
          if [ -f "$BINDER" ]; then
            sed -i 's/^extern inline bool is_audio_task/extern bool is_audio_task/' "$BINDER"
            ok $? "binder.h is_audio_task"
          fi
          if [ -f "$SAC" ]; then
            sed -i 's/^inline bool is_audio_task(struct task_struct \*task)/bool is_audio_task(struct task_struct *task)/' "$SAC"
            ok $? "common.c is_audio_task 定义"
          fi
          # zram（内核树自己的那份 + vendor 那份）
          ZK="drivers/block/zram/zram_drv_internal.h"
          ZKC="drivers/block/zram/zram_drv.c"
          if [ -f "$ZK" ]; then
            sed -i 's/^extern inline bool is_thp_zram/extern bool is_thp_zram/' "$ZK"
            sed -i 's/^extern inline unsigned long zram_page_state/extern unsigned long zram_page_state/' "$ZK"
            ok $? "tree zram_drv_internal.h"
          fi
          if [ -f "$ZKC" ]; then
            sed -i 's/^inline unsigned long zram_page_state(struct zram \*zram, int type)/unsigned long zram_page_state(struct zram *zram, int type)/' "$ZKC"
            sed -i 's/^inline bool is_thp_zram(struct zram \*zram)/bool is_thp_zram(struct zram *zram)/' "$ZKC"
            ok $? "tree zram_drv.c"
          fi
          ZH="$V/oplus/kernel/mm/hybridswap_zram/zram_drv_internal.h"
          ZC="$V/oplus/kernel/mm/hybridswap_zram/zram_drv.c"
          [ -f "$ZH" ] && {
            sed -i 's/^extern inline bool is_chp_zram/extern bool is_chp_zram/' "$ZH"
            sed -i 's/^extern inline unsigned long zram_page_state/extern unsigned long zram_page_state/' "$ZH"
            echo "  [ok]   vendor zram_drv_internal.h"
          }
          [ -f "$ZC" ] && {
            sed -i 's/^inline bool is_chp_zram(struct zram \*zram)/bool is_chp_zram(struct zram *zram)/' "$ZC"
            sed -i 's/^inline unsigned long zram_page_state(struct zram \*zram, int type)/unsigned long zram_page_state(struct zram *zram, int type)/' "$ZC"
            echo "  [ok]   vendor zram_drv.c"
          }
          # oplus_ofp_is_support
          OFP_H="$V/oplus/kernel/../../../drivers/gpu/drm/oplus/oplus_display_onscreenfingerprint.h"
          OFPH="drivers/gpu/drm/oplus/oplus_display_onscreenfingerprint.h"
          OFPC="drivers/gpu/drm/oplus/oplus_display_onscreenfingerprint.c"
          if [ -f "$OFPH" ]; then
            sed -i 's/^inline bool oplus_ofp_is_support(void);/extern bool oplus_ofp_is_support(void);/' "$OFPH"
            ok $? "ofp.h 声明"
          fi
          if [ -f "$OFPC" ]; then
            sed -i 's/^inline bool oplus_ofp_is_support(void)$/bool oplus_ofp_is_support(void)/' "$OFPC"
            ok $? "ofp.c 定义"
          fi
          # is_dma_buf_file（内核树已有实体，删多余声明）
          [ -f "$V/oplus/kernel/mm/mm_osvelte/memstat.h" ] && sed -i '/^extern inline int is_dma_buf_file/d' "$V/oplus/kernel/mm/mm_osvelte/memstat.h"
          # ws_all_release（无实体，删声明）
          [ -f "$V/oplus/kernel/wakelock_profiler/oplus_wakelock_profiler_mtk.c" ] && sed -i '/^extern inline bool ws_all_release(void);$/d' "$V/oplus/kernel/wakelock_profiler/oplus_wakelock_profiler_mtk.c"
          # 全 vendor 残留扫描
          echo "  --- vendor 残留 ^extern inline ---"
          grep -rn '^extern inline' "$V" --include=*.h --include=*.c 2>/dev/null | wc -l

          echo "===== B. sensor_devinfo.c K&R 空参数（真语法错，与编译器无关）====="
          for SDI in \
            "$V/oplus/sensor/kernel/oplus_sensor_devinfo/sensor_devinfo.c" \
            "$V/oplus/sensor/kernel/sensorhub/oplus_sensor_devinfo/sensor_devinfo.c" ; do
            if [ -f "$SDI" ]; then
              sed -i 's/^__attribute__((weak)) int register_lcdinfo_notifier() {/__attribute__((weak)) int register_lcdinfo_notifier(struct notifier_block *nb) {/' "$SDI"
              sed -i 's/^__attribute__((weak)) int unregister_lcdinfo_notifier() {/__attribute__((weak)) int unregister_lcdinfo_notifier(struct notifier_block *nb) {/' "$SDI"
              echo "  [ok]   $(basename $(dirname $SDI))"
            fi
          done

          echo "===== C. tp_devices.h 缺 TP_VXN 枚举 ====="
          TP="$V/oplus/kernel/touchpanel/oplus_touchscreen/tp_devices.h"
          if [ -f "$TP" ] && ! grep -q TP_VXN "$TP"; then
            sed -i 's/^    TP_TXD,/    TP_TXD,\n    TP_VXN,/' "$TP"
            ok $? "补 TP_VXN"
          fi

          echo "===== D. oplus_project 的 Kconfig/Makefile 挂载 ====="
          SYSKC="drivers/soc/oplus/system/Kconfig"
          if [ -f "$SYSKC" ]; then
            ADDED=0
            for sub in $(ls -d drivers/soc/oplus/system/*/ 2>/dev/null); do
              name=$(basename "$sub")
              [ -f "$sub/Kconfig" ] || continue
              rel="drivers/soc/oplus/system/$name/Kconfig"
              if ! grep -q "$rel" "$SYSKC"; then
                printf 'source "%s"\n' "$rel" >> "$SYSKC"
                ADDED=$((ADDED+1))
              fi
            done
            echo "  [ok]   补 $ADDED 条 Kconfig source"
          else
            echo "  [FAIL] 缺 $SYSKC"; fail=1
          fi
          # 两个头文件名都链到 vendor 真头文件
          rm -f include/soc/oplus/system/oppo_project.h
          SRC_PJ="$V/oplus/kernel/boot/include/oplus_project.h"
          [ -f "$SRC_PJ" ] || SRC_PJ="$V/oplus/kernel/system/include/oplus_project.h"
          if [ -f "$SRC_PJ" ]; then
            ln -sf "$SRC_PJ" include/soc/oplus/system/oplus_project.h
            ln -sf "$SRC_PJ" include/soc/oplus/system/oppo_project.h
            echo "  [ok]   oplus_project.h 已链接"
          fi
          [ -f include/scp.h ] || printf '%s\n' '#ifndef _SCP_FORWARD_H_' \
            '#define _SCP_FORWARD_H_' \
            '#include <../drivers/misc/mediatek/scp/include/scp.h>' \
            '#endif' > include/scp.h

          echo "===== E. is_key_process 缺失（vendor 里是 static）====="
          PROC_H="include/soc/oplus/system/oppo_process.h"
          rm -f "$PROC_H"
          printf '%s\n' \
            '#ifndef _OPPO_PROCESS_H_' \
            '#define _OPPO_PROCESS_H_' \
            '#include <linux/types.h>' \
            '#include <linux/sched.h>' \
            '#include <linux/pid.h>' \
            '#include <linux/string.h>' \
            'static inline bool is_key_process(struct task_struct *t)' \
            '{' \
            '	if (!t) return false;' \
            '	if (!strcmp(t->comm, "init") || !strcmp(t->comm, "system_server")' \
            '	    || !strcmp(t->comm, "surfaceflinger")' \
            '	    || !strcmp(t->comm, "servicemanager"))' \
            '		return true;' \
            '	return false;' \
            '}' \
            'static inline bool oppo_is_android_core_group(struct pid *pgrp) { return false; }' \
            '#endif' > "$PROC_H"
          ok $? "oppo_process.h 提供 is_key_process"

          echo "===== F. sy6529 括号优先级（真语法问题）====="
          SY="$V/oplus/kernel/charger/v1/voocphy/oplus_sy6529.c"
          [ -f "$SY" ] && {
            sed -i 's/if (\*data == sy6529_CHARGE_MODE_2_1 | \*data == sy6529_CHARGE_MODE_1_1)/if ((*data == sy6529_CHARGE_MODE_2_1) | (*data == sy6529_CHARGE_MODE_1_1))/' "$SY"
            ok $? "sy6529 括号"
          }

          echo "===== G. futex.c 里 vendor 未提供的 handler ====="
          FUTEX_C="kernel/futex.c"
          if [ -f "$FUTEX_C" ]; then
            cnt=$(grep -c 'locking_vh_.*_handler' "$FUTEX_C" 2>/dev/null || echo 0)
            echo "  发现 $cnt 处 locking_vh_*_handler 调用"
            if [ "$cnt" -gt 0 ]; then
              sed -i 's/^#if IS_ENABLED(CONFIG_OPLUS_LOCKING_STRATEGY)$/#if 0 \/* vendor handlers not provided *\//' "$FUTEX_C"
              echo "  已屏蔽（vendor 提供的是 android_vh_* / locking_vh_do_futex，名字对不上）"
            fi
          fi

          echo "===== H. -Werror 全量降级（clang 下警告更多）====="
          grep -rl -- "-Werror" --include=Makefile --include=Kbuild \
               --include="*.mk" --include="*.mak" . 2>/dev/null | while read -r f; do
            sed -i 's/-Werror=/-Wno-error=/g; s/-Werror-\([A-Za-z0-9_-]*\)/-Wno-error=\1/g; s/\(^\|[[:space:]]\)-Werror\([[:space:]]\|$\)/\1-Wno-error\2/g' "$f"
          done
          # vendor 侧也扫一遍
          grep -rl -- "-Werror" --include=Makefile --include=Kbuild \
               --include="*.mk" --include="*.mak" "$V" 2>/dev/null | while read -r f; do
            sed -i 's/-Werror=/-Wno-error=/g; s/-Werror-\([A-Za-z0-9_-]*\)/-Wno-error=\1/g; s/\(^\|[[:space:]]\)-Werror\([[:space:]]\|$\)/\1-Wno-error\2/g' "$f"
          done
          echo "  剩余 -Werror(Makefile): $(grep -rn -- '-Werror' --include=Makefile . 2>/dev/null | wc -l)"
          # subdir-ccflags 里也塞一份，覆盖所有子目录
          if ! grep -q 'Wno-error=sizeof-pointer-memaccess' Makefile; then
            printf '\n# clang 下大量历史代码触发的新警告，统一降级\nKBUILD_CFLAGS += -Wno-error=sizeof-pointer-memaccess -Wno-error=format -Wno-error=format-extra-args -Wno-error=format-overflow -Wno-error=format-truncation -Wno-error=stringop-truncation -Wno-error=stringop-overflow -Wno-error=stringop-overread -Wno-error=array-bounds -Wno-error=address-of-packed-member -Wno-error=tautological-compare -Wno-error=unused-but-set-variable -Wno-error=unused-variable -Wno-error=unused-function -Wno-error=unused-value -Wno-error=unused-label -Wno-error=missing-braces -Wno-error=parentheses -Wno-error=switch -Wno-error=misleading-indentation -Wno-error=int-conversion -Wno-error=incompatible-pointer-types -Wno-error=pointer-to-int-cast -Wno-error=int-to-pointer-cast -Wno-error=declaration-after-statement -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=return-type -Wno-error=strict-prototypes -Wno-error=old-style-definition -Wno-error=missing-prototypes -Wno-error=deprecated-declarations -Wno-error=unused-result -Wno-error=builtin-declaration-mismatch -Wno-error=maybe-uninitialized -Wno-error=memset-elt-size\n' >> Makefile
            echo "  [ok]   Makefile 追加 clang 警告降级"
          fi

          [ "$fail" -eq 0 ] && echo "ALL PATCHES OK" || { echo "!! 有必改项失败"; exit 1; }

      - name: Prepare config (对齐原厂 clang/LTO/CFI)
        run: |
          set -eu
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

          mkdir -p out
          cp /tmp/stock.config out/.config

          # ★★★ 关键：先跑一次 olddefconfig，让 kconfig 把 (NEW) symbol 全部
          # 按默认值算完。这一步会重算，会丢掉一些原厂的 =y。
          # 所以必须在它之后、make 之前，把关键项再写回去。
          # 之前漏了这一步，导致 make 期间隐式 silentoldconfig 弹 (NEW) 提问
          # 读 stdin 失败 → 整份 config 被按默认重算 → f2fs 压缩等 117 项丢失。
          echo "=== olddefconfig（先落定，别让它污染后面的 make）==="
          yes '' 2>/dev/null | make O=out olddefconfig > /tmp/oldcfg.log 2>&1 || true
          tail -5 /tmp/oldcfg.log || true

          echo "=== 落定后的状态（这是被重算过的，可能已经丢了东西）==="
          grep -cE '^CONFIG_.*=|^# CONFIG_.*is not set' out/.config || true

          echo ""
          echo "=== ★ 强制回写：原厂有的项，被 olddefconfig 丢掉的一律补回 ==="
          # 三种情况都要处理：
          #   1. 变成 "# CONFIG_X is not set"  → 替换
          #   2. 变成 "CONFIG_X=n"（罕见）      → 替换
          #   3. 整行消失                       → 追加
          FIXED_REPL=0
          FIXED_ADD=0
          while IFS= read -r line; do
            case "$line" in
              CONFIG_*=y|CONFIG_*=m|CONFIG_*=\"*\") ;;
              *) continue ;;
            esac
            sym="${line%%=*}"
            if grep -q "^${sym}=" out/.config 2>/dev/null; then
              :  # 还在，不动
            elif grep -q "^# ${sym} is not set" out/.config 2>/dev/null; then
              sed -i "s|^# ${sym} is not set|${line}|" out/.config
              FIXED_REPL=$((FIXED_REPL+1))
            else
              printf '%s\n' "$line" >> out/.config
              FIXED_ADD=$((FIXED_ADD+1))
            fi
          done < /tmp/stock.config
          echo "  替换 is-not-set: $FIXED_REPL 项"
          echo "  整行补回:       $FIXED_ADD 项"

          echo ""
          echo "=== 逐个确认关键项 ==="
          for k in F2FS_FS_COMPRESSION F2FS_FS_LZO F2FS_FS_LZ4 F2FS_FS_ZSTD \
                   F2FS_FS_ENCRYPTION RELR TOOLS_SUPPORT_RELR \
                   CFI CFI_CLANG CFI_CLANG_SHADOW LTO_CLANG THINLTO \
                   CC_IS_CLANG LD_IS_LLD CLANG_VERSION; do
            cur=$(grep -m1 "^${k}=" out/.config || grep -m1 "^# ${k} is not set" out/.config || echo "  (无)")
            echo "  ${k}: ${cur}"
          done

          echo ""
          echo "=== 触摸屏驱动逐个确认（丢了开机没触摸）==="
          for k in TOUCHPANEL_NOVA_NT36672C_NOFLASH TOUCHPANEL_FOCAL_FT8006S_AA \
                   TOUCHPANEL_HIMAX_HX83102D_NOFLASH TOUCHPANEL_ILITEK_ILITEK7807S \
                   TOUCHPANEL_CHIPONE_ICNL9911C TOUCHPANEL_NOVA_NT36525B_NOFLASH; do
            cur=$(grep -m1 "^${k}=" out/.config || grep -m1 "^# ${k} is not set" out/.config || echo "  (无)")
            echo "  ${k}: ${cur}"
          done

          echo ""
          echo "=== LOCALVERSION 必须为空（由脏树自动加 +）==="
          if grep -q '^CONFIG_LOCALVERSION=' out/.config; then
            sed -i 's|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=""|' out/.config
          else
            printf 'CONFIG_LOCALVERSION=""\n' >> out/.config
          fi
          grep -n '^CONFIG_LOCALVERSION' out/.config

          echo ""
          echo "=== Droidspaces 必需 8 项 ==="
          for kv in CONFIG_SYSVIPC=y CONFIG_SYSVIPC_SYSCTL=y CONFIG_IPC_NS=y \
                    CONFIG_USER_NS=y CONFIG_CGROUP_PIDS=y CONFIG_DEVTMPFS=y \
                    CONFIG_DEVTMPFS_MOUNT=y CONFIG_POSIX_MQUEUE=y; do
            sym="${kv%%=*}"
            if grep -q "^${sym}=" out/.config; then
              sed -i "s|^${sym}=.*|${kv}|" out/.config
            elif grep -q "^# ${sym} is not set" out/.config; then
              sed -i "s|^# ${sym} is not set|${kv}|" out/.config
            else
              printf '%s\n' "$kv" >> out/.config
            fi
          done

          echo "=== OPPO 模块 ==="
          for kv in CONFIG_OPLUS_FEATURE_OPROJECT=y CONFIG_OPLUS_FEATURE_FEEDBACK=y; do
            sym="${kv%%=*}"
            if grep -q "^${sym}=" out/.config; then
              sed -i "s|^${sym}=.*|${kv}|" out/.config
            elif grep -q "^# ${sym} is not set" out/.config; then
              sed -i "s|^# ${sym} is not set|${kv}|" out/.config
            else
              printf '%s\n' "$kv" >> out/.config
            fi
          done

          echo "=== MODULE_SIG 关闭（无 OPPO 私钥）==="
          for s in MODULE_SIG MODULE_SIG_FORCE MODULE_SIG_ALL; do
            if grep -q "^CONFIG_${s}=" out/.config; then
              sed -i "s|^CONFIG_${s}=.*|# CONFIG_${s} is not set|" out/.config
            fi
          done

          echo ""
          echo "=== 最终 config 统计 ==="
          echo "  =y 项: $(grep -c '=y$' out/.config || true)"
          echo "  总项:  $(grep -cE '^CONFIG_|^# CONFIG_' out/.config || true)"
          echo "  原厂:  $(grep -cE '^CONFIG_|^# CONFIG_' /tmp/stock.config || true)"
          git status --porcelain 2>/dev/null | wc -l | xargs echo "  脏文件数:"

      - name: Build with clang + LTO + CFI
        run: |
          set +e
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          # ★ 关键：禁止 kbuild 在 make 期间静默更新 .config。
          # 不加这个，make 会隐式跑 silentoldconfig，碰到 (NEW) symbol
          # 就去读 stdin，CI 里 stdin 空 → 读失败 → 整份 config 按默认重算
          # → f2fs 压缩、触摸驱动等 117 项丢失 → 刷了卡 logo / 没触摸。
          export KCONFIG_NOSILENTUPDATE=1

          echo "=== 工具链版本 ==="
          clang --version | head -2
          ld.lld --version

          echo "=== 确认 .config 没被改（和 Prepare 阶段 md5 对上）==="
          md5sum out/.config
          grep -c '=y$' out/.config || true

          make O=out ARCH=arm64 -j$(nproc) Image.gz > /tmp/build.log 2>&1
          RC=$?
          set -e

          echo "=== BUILD EXIT: $RC ==="
          echo "=== 是否又发生 config 重算 ==="
          grep -c 'Restart config' /tmp/build.log && echo "  !! 又重算了" || echo "  [OK] 没有重算"
          grep -c 'Error in reading or end of file' /tmp/build.log && echo "  !! 又有读 stdin 失败" || echo "  [OK] 没有 stdin 失败"

          echo "=== error 行（最多 80）==="
          grep -E "error:|fatal error:" /tmp/build.log | grep -v -E "TPD_INFO|printk|dev_info|dev_err" | head -80 || true
          echo "=== 最后 30 行 ==="
          tail -30 /tmp/build.log || true
          echo "=== 产物 ==="
          ls -la out/arch/arm64/boot/ 2>&1 | head -20 || true

          echo "=== 编完后再验 config 关键项还在不在 ==="
          for k in F2FS_FS_COMPRESSION CFI_CLANG LTO_CLANG THINLTO; do
            echo "  ${k}: $(grep -m1 "^CONFIG_${k}=" out/.config || grep -m1 "^# CONFIG_${k} is not set" out/.config || echo 无)"
          done

          if [ "$RC" -ne 0 ]; then exit 1; fi

      - name: Gate - vermagic / CFI / LTO
        if: success()
        run: |
          set +e
          IMG=out/arch/arm64/boot/Image
          [ -f "$IMG" ] || { echo "!! 没有 Image"; exit 1; }

          echo "=== 门禁 1: vermagic ==="
          VM=$(strings -a "$IMG" | grep -m1 'SMP.*mod_unload' || echo "")
          echo "  实际: [$VM]"
          echo "  期望: [4.19.191+ SMP preempt mod_unload modversions aarch64]"
          if [ "$VM" != "4.19.191+ SMP preempt mod_unload modversions aarch64" ]; then
            echo "  [FAIL] vermagic 不符 → 会变砖"
            exit 1
          fi
          echo "  [PASS]"

          echo "=== 门禁 2: CFI 是否真的启用 ==="
          CFI_CNT=$(strings -a "$IMG" | grep -c '^__cfi_' || echo 0)
          echo "  __cfi_ 符号数: $CFI_CNT"
          if [ "$CFI_CNT" -lt 100 ]; then
            echo "  [WARN] CFI 符号偏少，可能没真正启用"
          else
            echo "  [PASS] CFI 已启用"
          fi

          echo "=== 门禁 3: 内核大小与原厂同量级 ==="
          SZ=$(stat -c%s "$IMG")
          echo "  Image 大小: $SZ  (原厂 47,462,400)"
          if [ "$SZ" -lt 30000000 ] || [ "$SZ" -gt 80000000 ]; then
            echo "  [WARN] 大小异常"
          else
            echo "  [PASS]"
          fi

          echo "=== 门禁 4: config 关键项 ==="
          for k in CONFIG_LTO_CLANG CONFIG_CFI_CLANG CONFIG_MODVERSIONS CONFIG_OPLUS_FEATURE_OPROJECT; do
            if grep -q "^$k=y" out/.config; then echo "  [OK]   $k=y"; else echo "  [WARN] $k 非 y"; fi
          done

          echo "ALL GATES DONE"

      - name: Package
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd out/arch/arm64/boot 2>/dev/null || { echo "no boot dir"; exit 0; }
          if [ -f Image.gz ]; then
            cp Image.gz "$GITHUB_WORKSPACE/artifacts/kernel_Image.gz"; echo "used Image.gz"
          elif [ -f Image ]; then
            gzip -9 -c Image > "$GITHUB_WORKSPACE/artifacts/kernel_Image.gz"; echo "gzipped Image"
          fi
          [ -f Image ] && cp Image "$GITHUB_WORKSPACE/artifacts/kernel_Image.raw"
          [ -f System.map ] && cp System.map "$GITHUB_WORKSPACE/artifacts/kernel.System.map"
          [ -f "$GITHUB_WORKSPACE/out/.config" ] && cp "$GITHUB_WORKSPACE/out/.config" "$GITHUB_WORKSPACE/artifacts/kernel.config"
          [ -f vmlinux ] && cp vmlinux "$GITHUB_WORKSPACE/artifacts/vmlinux" || true
          cp /tmp/build.log "$GITHUB_WORKSPACE/artifacts/build.log" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/artifacts/" || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: artifacts/
          if-no-files-found: warn
