name: Build PJS110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: oppo-source/android_kernel_oppo_mt6833
          ref: oppo/mt6833_t_13.1.1_a2x_5g
          fetch-depth: 1

      - name: Vendor + kernel-4.19 symlink
        run: |
          set -u
          PARENT=$(dirname "$GITHUB_WORKSPACE")
          cd "$PARENT"
          curl -sL -o vendor.tar.gz \
            https://github.com/wf200866/pjs110-kernel-build/releases/download/vendor-v1/vendor.tar.gz
          tar xzf vendor.tar.gz
          rm -f vendor.tar.gz
          du -sh "$PARENT/vendor" || true
          [ -e kernel-4.19 ] || ln -s "$(basename "$GITHUB_WORKSPACE")" kernel-4.19
          cd "$GITHUB_WORKSPACE"
          test -f kernel/sched_assist/Kconfig && echo "  OK sched_assist" || echo "  BREAK sched_assist"
          test -f include/linux/sched_assist/sched_assist_binder.h && echo "  OK binder.h" || echo "  BREAK binder.h"

      - name: Stock config
        run: |
          curl -sL -o /tmp/stock.config \
            https://github.com/wf200866/pjs110-kernel-build/releases/download/vendor-v1/pjs110_stock.config
          wc -l /tmp/stock.config

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make libncurses-dev flex bison libssl-dev bc \
                                    cpio lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          # ★★★ 必须用 clang 11.0.1，和原厂完全一致 ★★★
          #
          # 为什么不能用 GCC：
          #   原厂 config: CONFIG_CC_IS_CLANG=y / CONFIG_CFI_CLANG=y / CONFIG_LTO_CLANG=y
          #   struct module 里有：
          #       #ifdef CONFIG_CFI_CLANG
          #           cfi_check_fn cfi_check;
          #       #endif
          #   GCC 不支持 CFI，这个字段消失 → struct module 布局变 → CRC 变
          #
          #   实测：GCC 编出来 module_layout CRC = 0xa11ea8b9
          #         设备 10 个 vendor .ko 期望   = 0xddfea5da
          #         不一致 → "disagrees about version of symbol module_layout"
          #         → WiFi / 蓝牙 / GPS / FM / fpsgo 全部加载失败
          #
          #   CC_IS_CLANG 是 kbuild 探测编译器得出的，写进 config 没用，必须真的换编译器
          #
          # AOSP clang-r383902 = clang 11.0.1，正是原厂 CONFIG_CLANG_VERSION=110001
          set -e
          CLANG_DIR="$HOME/clang-r383902"
          rm -rf "$CLANG_DIR"
          echo "  获取 clang 11.0.1 (r383902)..."
          # 优先 git shallow clone（archive 对大仓库容易超时）
          if git clone --depth 1 --branch lineage-20 \
               https://github.com/Jacksonzwang/android_prebuilts_clang_kernel_linux-x86_clang-r383902.git \
               "$CLANG_DIR" 2>&1 | tail -3; then
            echo "  [ok] clone 完成"
          else
            echo "  [!!] clone 失败，试 tarball"
            mkdir -p "$CLANG_DIR"
            curl -sL --max-time 600 -o /tmp/clang.tar.gz \
              "https://github.com/Jacksonzwang/android_prebuilts_clang_kernel_linux-x86_clang-r383902/archive/refs/heads/lineage-20.tar.gz"
            tar xzf /tmp/clang.tar.gz -C "$CLANG_DIR" --strip-components=1
          fi
          ls "$CLANG_DIR/bin/clang" || { echo "!! 找不到 bin/clang"; exit 1; }
          "$CLANG_DIR/bin/clang" --version || { echo "!! clang 跑不起来"; exit 1; }
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "  [ok] clang 就位: $CLANG_DIR"

      - name: Patch OPPO source defects
        run: |
          set -u
          V="$(dirname "$GITHUB_WORKSPACE")/vendor"
          fail=0
          ok()  { if [ "$1" = "0" ]; then echo "  [ok]   $2"; else echo "  [FAIL] $2"; fail=1; fi; }

          echo "===== A. fs/proc/Kconfig ====="
          sed -i '/cpu_jankinfo\/Kconfig/d' fs/proc/Kconfig
          ok $? "去掉 cpu_jankinfo 引用"

          echo "===== B. core 头文件 inline 声明 ====="
          sed -i 's/^extern inline bool handle_chp_ext_cmd/extern bool handle_chp_ext_cmd/' include/linux/mm.h 2>/dev/null || true
          sed -i 's/^inline void uclamp_se_set/extern void uclamp_se_set/' kernel/sched/sched.h 2>/dev/null || true
          sed -i 's/^inline void ksm_flock/extern void ksm_flock/' include/linux/keyslot-manager.h 2>/dev/null || true
          sed -i 's/^inline void blk_crypto_flock/extern void blk_crypto_flock/' include/linux/blk-crypto.h 2>/dev/null || true

          echo "===== C0. 通用 inline 降级（全树 + vendor） ====="
          echo '' | base64 -d > /tmp/inline_fix.py
          python3 -c "import ast,sys; ast.parse(open('/tmp/inline_fix.py').read())" && echo "  [ok]   inline_fix.py 语法 OK"
          echo "--- 内核树 ---"
          python3 /tmp/inline_fix.py . 2>&1 | tail -50 || true
          echo "--- vendor ---"
          python3 /tmp/inline_fix.py "$V" 2>&1 | tail -50 || true
          echo "--- 残留 ^extern inline ---"
          echo -n "tree: "; grep -rn '^extern inline' drivers include kernel mm block fs net sound crypto security 2>/dev/null | wc -l
          echo -n "vendor: "; grep -rn '^extern inline' "$V" --include=*.h --include=*.c 2>/dev/null | wc -l

          echo "===== C1. sensor_devinfo.c 空参数 ====="
          SDI="$V/oplus/sensor/kernel/oplus_sensor_devinfo/sensor_devinfo.c"
          if [ -f "$SDI" ]; then
            sed -i 's/^__attribute__((weak)) int register_lcdinfo_notifier() {/__attribute__((weak)) int register_lcdinfo_notifier(struct notifier_block *nb) {/' "$SDI"
            sed -i 's/^__attribute__((weak)) int unregister_lcdinfo_notifier() {/__attribute__((weak)) int unregister_lcdinfo_notifier(struct notifier_block *nb) {/' "$SDI"
            ok $? "sensor_devinfo.c 补原型"
            grep -n 'lcdinfo_notifier' "$SDI" | head -6
          else
            echo "  [FAIL] 缺 $SDI"; fail=1
          fi
          SDI2="$V/oplus/sensor/kernel/sensorhub/oplus_sensor_devinfo/sensor_devinfo.c"
          [ -f "$SDI2" ] && {
            sed -i 's/^__attribute__((weak)) int register_lcdinfo_notifier() {/__attribute__((weak)) int register_lcdinfo_notifier(struct notifier_block *nb) {/' "$SDI2"
            sed -i 's/^__attribute__((weak)) int unregister_lcdinfo_notifier() {/__attribute__((weak)) int unregister_lcdinfo_notifier(struct notifier_block *nb) {/' "$SDI2"
            echo "  [ok]   sensorhub 版同步"
          }

          echo "===== D. 其他 ====="
          # is_key_process: 内核树 signal.c 调用它，但 vendor 里是 static（内部链接）
          # stability_helper 是外部模块(KBUILD_OPTIONS=m)，不会进 vmlinux
          # 最省事：在 oppo_process.h 里提供 static inline 实现（只用于打日志）
          PROC_H="include/soc/oplus/system/oppo_process.h"
          if [ -L "$PROC_H" ]; then rm -f "$PROC_H"; fi
          printf '%s\n' \
            '#ifndef _OPPO_PROCESS_H_' \
            '#define _OPPO_PROCESS_H_' \
            '#include <linux/types.h>' \
            '#include <linux/sched.h>' \
            '#include <linux/pid.h>' \
            '#include <linux/string.h>' \
            'static inline bool is_key_process(struct task_struct *t)' \
            '{' \
            '	if (!t) return false;' \
            '	if (!strcmp(t->comm, "init") || !strcmp(t->comm, "system_server")' \
            '	    || !strcmp(t->comm, "surfaceflinger")' \
            '	    || !strcmp(t->comm, "servicemanager"))' \
            '		return true;' \
            '	return false;' \
            '}' \
            'static inline bool oppo_is_android_core_group(struct pid *pgrp) { return false; }' \
            '#endif' > "$PROC_H"
          ok $? "oppo_process.h 提供 static inline is_key_process"
          grep -c 'is_key_process' "$PROC_H"
          SY="$V/oplus/kernel/charger/v1/voocphy/oplus_sy6529.c"
          [ -f "$SY" ] && {
            sed -i 's/if (\*data == sy6529_CHARGE_MODE_2_1 | \*data == sy6529_CHARGE_MODE_1_1)/if ((*data == sy6529_CHARGE_MODE_2_1) | (*data == sy6529_CHARGE_MODE_1_1))/' "$SY"
            ok $? "sy6529 括号"
          }
          TP="$V/oplus/kernel/touchpanel/oplus_touchscreen/tp_devices.h"
          if [ -f "$TP" ] && ! grep -q TP_VXN "$TP"; then
            sed -i 's/^    TP_TXD,/    TP_TXD,\n    TP_VXN,/' "$TP"
            ok $? "tp_devices.h 补 TP_VXN"
          fi

          echo "===== E. 头部 + 编译挂载 ====="
          mkdir -p include/soc/oplus/system
          # oppo_process.h 已在 D 段生成（含 static inline is_key_process），此处不再覆盖
          # --- 根因：drivers/soc/oplus/Makefile 是 0 字节空文件 ---
          # drivers/soc/oplus/system -> vendor/oplus/kernel/system 链接已存在
          # 但空 Makefile 导致 system/ 从不被递归，oplus_project 永远编不进去
          SOCMK="drivers/soc/oplus/Makefile"
          echo "  --- 修前 ---"; cat "$SOCMK" 2>/dev/null; echo "[EOF]"
          # drivers/soc/Makefile 已有 obj-y += oplus/system/，此处无需再加 system/
          # 保留原内容，只在缺失时补 healthinfo（原文件本来就该有）
          if ! grep -q 'healthinfo/' "$SOCMK" 2>/dev/null; then
            printf 'obj-y += healthinfo/\n' >> "$SOCMK"
          fi
          echo "  --- 修后 ---"; cat "$SOCMK"; echo "[EOF]"

          # ★ 根因：system/Kconfig 没 source 子模块的 Kconfig
          # 导致 CONFIG_OPLUS_FEATURE_OPROJECT / CONFIG_OPLUS_FEATURE_FEEDBACK
          # 都是未声明 symbol，写进 .config 会被丢弃 → 对应 .o 不编译 → undefined reference
          SYSKC="drivers/soc/oplus/system/Kconfig"
          echo "  --- $SYSKC 修前 ---"; tail -3 "$SYSKC" 2>/dev/null; echo "[EOF]"
          if [ -f "$SYSKC" ]; then
            # 遍历 system/ 下所有子目录 Kconfig，缺谁补谁
            ADDED=0
            for sub in $(ls -d drivers/soc/oplus/system/*/ 2>/dev/null); do
              name=$(basename "$sub")
              [ -f "$sub/Kconfig" ] || continue
              rel="drivers/soc/oplus/system/$name/Kconfig"
              if ! grep -q "$rel" "$SYSKC"; then
                printf 'source "%s"\n' "$rel" >> "$SYSKC"
                echo "  [ok]   补 source $rel"
                ADDED=$((ADDED+1))
              fi
            done
            echo "  共补 $ADDED 条 source"
            ok 0 "system/Kconfig 补齐子模块"
          else
            echo "  [FAIL] 缺 $SYSKC"; fail=1
          fi
          echo "  --- 修后（全部 source 行）---"
          grep -n 'source' "$SYSKC" | head -40
          # 关键 symbol 校验
          for sym in OPLUS_FEATURE_OPROJECT OPLUS_FEATURE_FEEDBACK; do
            if grep -rq "config $sym" drivers/soc/oplus/system/ 2>/dev/null; then
              echo "  [ok]   $sym 已定义"
            else
              echo "  [FAIL] $sym 未定义"; fail=1
            fi
          done
          test -d drivers/soc/oplus/system/oplus_project \
            && echo "  [ok]   system/oplus_project 可访问" \
            || { echo "  [FAIL] system/oplus_project 不存在"; fail=1; }
          test -f drivers/soc/oplus/system/Makefile \
            && echo "  [ok]   system/Makefile 存在（内含 OPROJECT 分支）" \
            || { echo "  [FAIL] system/Makefile 缺失"; fail=1; }
          # 两个头文件名字都链到 vendor 真头文件
          rm -f include/soc/oplus/system/oppo_project.h
          SRC_PJ="$V/oplus/kernel/boot/include/oplus_project.h"
          [ -f "$SRC_PJ" ] || SRC_PJ="$V/oplus/kernel/system/include/oplus_project.h"
          if [ -f "$SRC_PJ" ]; then
            ln -sf "$SRC_PJ" include/soc/oplus/system/oplus_project.h
            ln -sf "$SRC_PJ" include/soc/oplus/system/oppo_project.h
            echo "  [ok]   两个名字链到 $(basename $(dirname $(dirname $SRC_PJ)))/include/oplus_project.h"
          else
            echo "  [FAIL] 找不到 vendor 的 oplus_project.h"; fail=1
          fi
          [ -f include/scp.h ] || printf '%s\n' '#ifndef _SCP_FORWARD_H_' \
            '#define _SCP_FORWARD_H_' \
            '#include <../drivers/misc/mediatek/scp/include/scp.h>' \
            '#endif' > include/scp.h
          ok $? "桩头文件处理"

          echo "===== F. -Werror -> -Wno-error ====="
          grep -rl -- "-Werror" --include=Makefile --include=Kbuild --include="*.mk" . 2>/dev/null | while read -r f; do
            sed -i 's/-Werror=/-Wno-error=/g; s/-Werror-\([A-Za-z0-9_-]*\)/-Wno-error=\1/g; s/\(^\|[[:space:]]\)-Werror\([[:space:]]\|$\)/\1-Wno-error\2/g' "$f"
          done
          echo "  剩余 -Werror: $(grep -rn -- '-Werror' --include=Makefile . 2>/dev/null | wc -l)"

          echo "===== G. config ====="
          cp /tmp/stock.config out.config
          # ★ 致命项：原厂 vermagic 是 "4.19.191+"（带一个加号）
          # 这个 + 是 kbuild 检测到 git 树脏（有本地改动）时自动追加的
          # 我们整个 patch 流程都在改源码，树一定是脏的 → 会自动得到 +
          # 所以 CONFIG_LOCALVERSION 必须留空，绝不能手动写 "+"
          #   LOCALVERSION="" + 脏树 → "4.19.191+"   正确
          #   LOCALVERSION="+" + 脏树 → "4.19.191++" 错误（实测过，会变砖）
          #   LOCALVERSION="" + 干净树 → "4.19.191"  错误（上次不开机的原因）
          if grep -q '^CONFIG_LOCALVERSION=' out.config; then
            sed -i 's|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=""|' out.config
          else
            printf 'CONFIG_LOCALVERSION=""\n' >> out.config
          fi
          grep -n '^CONFIG_LOCALVERSION' out.config
          echo "  [ok]   LOCALVERSION 留空，由脏树自动追加 +"
          # 保险：确认树确实是脏的（否则 + 不会出现）
          if git -C . rev-parse --git-dir >/dev/null 2>&1; then
            DIRTY=$(git -C . status --porcelain 2>/dev/null | head -1)
            [ -n "$DIRTY" ] && echo "  [ok]   树是脏的，会得到 +" || echo "  [!!] 树是干净的，vermagic 会缺 +"
          else
            echo "  [note] 非 git 树，kbuild 会按 setlocalversion 规则处理"
          fi
          # Droidspaces 必需
          # ★ 二次排查结论（2026-10-31）：
          #   CONFIG_SYSVIPC / POSIX_MQUEUE 会给 task_struct 加字段，
          #   但 module_layout 的 CRC 只对 struct module 计算，与 task_struct 无关。
          #   → 这两项掉 ko 的锅是无辜的，可以放心开。
          #   （真正元凶是 CONFIG_MODULE_SIG，见下方说明）
          #
          #   MODVERSIONS 的其它符号 CRC 确实会受结构体布局影响，
          #   但 vendor ko 只依赖少数几个（实测导入符号里没有 task_struct 相关），
          #   所以 SYSVIPC 安全。
          printf '\nCONFIG_SYSVIPC=y\nCONFIG_SYSVIPC_SYSCTL=y\nCONFIG_IPC_NS=y\nCONFIG_USER_NS=y\nCONFIG_CGROUP_PIDS=y\nCONFIG_DEVTMPFS=y\nCONFIG_DEVTMPFS_MOUNT=y\nCONFIG_POSIX_MQUEUE=y\nCONFIG_TMPFS_XATTR=y\n' >> out.config
          # OPPO 项目信息 + 反馈模块：原厂未开，导致 get_eng_version / oplus_kevent_fb_str 无定义
          printf 'CONFIG_OPLUS_FEATURE_OPROJECT=y\nCONFIG_OPLUS_FEATURE_FEEDBACK=y\n' >> out.config
          # 内核树 kernel/futex.c 调用 locking_vh_do_futex_handler，
          # 但两套 vendor 代码（sched_assist/sync、synchronize）都不提供该符号
          # （它们提供的是 locking_vh_do_futex / android_vh_do_futex_handler）
          # → 直接把调用点用 #if 0 屏蔽，功能等价于未启用该优化
          FUTEX_C="kernel/futex.c"
          if [ -f "$FUTEX_C" ]; then
            cnt=$(grep -c 'locking_vh_.*_handler' "$FUTEX_C" 2>/dev/null || echo 0)
            echo "  发现 $cnt 处 locking_vh_*_handler 调用"
            # 把所有 #if IS_ENABLED(CONFIG_OPLUS_LOCKING_STRATEGY) 改成 #if 0
            # 这些块里全是 vendor 未提供的 _handler 符号
            sed -i 's/^#if IS_ENABLED(CONFIG_OPLUS_LOCKING_STRATEGY)$/#if 0 \/* oplus locking strategy: vendor handlers not provided *\//' "$FUTEX_C"
            left=$(grep -c 'IS_ENABLED(CONFIG_OPLUS_LOCKING_STRATEGY)' "$FUTEX_C" 2>/dev/null || echo 0)
            echo "  剩余 IS_ENABLED(CONFIG_OPLUS_LOCKING_STRATEGY): $left"
            grep -n 'vendor handlers not provided' "$FUTEX_C" | head -12
            ok 0 "futex.c 屏蔽 vendor 缺失的 handler 调用"
          else
            echo "  [note] $FUTEX_C 缺失"
          fi

          # 同理，kernel/locking/mutex.c 调用 mutex_list_add，需要 sched_assist_mutex
          # 这个在 sched_assist 目录但只在 CONFIG_OPLUS_LOCKING_STRATEGY 下编
          # → 打开 LOCKING_STRATEGY（futex 那处已屏蔽，不会有符号问题）
          if grep -q '^# CONFIG_OPLUS_LOCKING_STRATEGY is not set' out.config; then
            sed -i 's/^# CONFIG_OPLUS_LOCKING_STRATEGY is not set/CONFIG_OPLUS_LOCKING_STRATEGY=y/' out.config
          elif ! grep -q '^CONFIG_OPLUS_LOCKING_STRATEGY=' out.config; then
            printf 'CONFIG_OPLUS_LOCKING_STRATEGY=y\n' >> out.config
          fi
          echo "  [ok]   LOCKING_STRATEGY=y（提供 mutex_list_add）"
          grep -E '^CONFIG_OPLUS_LOCKING_STRATEGY=' out.config || true
          # ★★★ 关键修正（2026-10-31 二次排查）：module_layout CRC 的真正元凶 ★★★
          #
          # 症状：10 个 vendor .ko 全部报
          #       "disagrees about version of symbol module_layout" → Exec format error
          #       → WiFi / 蓝牙 / GPS / FM / fpsgo 全废
          #
          # 我一开始归因于 CONFIG_SYSVIPC（task_struct 加字段），那是错的。
          # scripts/mod/modpost.c 里 module_layout 的 CRC 只对 【struct module】 计算，
          # 与 task_struct 无关。而 struct module 里有：
          #
          #     #ifdef CONFIG_MODULE_SIG
          #         bool sig_ok;
          #     #endif
          #
          # 关掉 MODULE_SIG → sig_ok 字段消失 → struct module 变小 → CRC 变
          # 实测设备 10 个 ko 期望的 CRC 统一是 0xddfea5da（原厂内核算出）
          #
          # 正确做法：MODULE_SIG 必须保持 =y（保住 struct module 布局）
          #           只关 MODULE_SIG_FORCE（不强制校验签名，否则 vendor ko 因无签名被拒）
          #           * 注意：SIG_ALL 也关（否则每次编译要现场生成签名密钥，浪费时间）
          sed -i 's/^# CONFIG_MODULE_SIG is not set/CONFIG_MODULE_SIG=y/' out.config
          if ! grep -q '^CONFIG_MODULE_SIG=' out.config; then
            printf 'CONFIG_MODULE_SIG=y\n' >> out.config
          fi
          sed -i 's/^CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/' out.config
          sed -i 's/^CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/' out.config
          echo "  [关键] MODULE_SIG=y（保住 struct module 布局 → module_layout CRC 不变）"
          echo "  [关键] MODULE_SIG_FORCE=n（不强制校验 → vendor ko 能加载）"
          grep -E '^CONFIG_MODULE_SIG' out.config || true
          grep -E "^CONFIG_(SYSVIPC|IPC_NS|USER_NS|CGROUP_PIDS|DEVTMPFS|POSIX_MQUEUE|OPLUS_FEATURE_OPROJECT)=" out.config || true

          [ "$fail" -eq 0 ] && echo "ALL PATCHES OK" || { echo "!! 有必改项失败"; exit 1; }

      - name: Build
        run: |
          # ★ 用 clang 11.0.1 + LLD，和原厂工具链一致
          #
          # clang 不像 gcc 那样自带 target 前缀，必须显式给 CROSS_COMPILE
          #   aarch64-linux-gnu-  → kbuild 会拼成 --target=aarch64-linux-gnu
          # 千万别 unset CROSS_COMPILE，否则 clang 按 host x86_64 编，
          # arm64 内联汇编全报 "unknown register name 'x1'"
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          clang --version | head -2
          echo "  验证 target:"
          echo 'int main(){return 0;}' > /tmp/t.c
          clang --target=aarch64-linux-gnu -c /tmp/t.c -o /tmp/t.o && file /tmp/t.o
          mkdir -p out
          cp out.config out/.config
          KCF="-I$PWD/drivers/misc/mediatek/scp/include -I$PWD/drivers/misc/mediatek/include -Wno-error -Wno-error=strict-prototypes -Wno-error=return-type -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=incompatible-pointer-types -Wno-error=format -Wno-error=format-extra-args -Wno-error=format-overflow -Wno-error=format-truncation -Wno-error=deprecated-declarations -Wno-error=unused-but-set-variable -Wno-error=unused-variable -Wno-error=unused-value -Wno-error=missing-prototypes -Wno-error=old-style-definition -Wno-error=int-conversion -Wno-error=declaration-after-statement -Wno-error=inline -Wno-error=maybe-uninitialized -Wno-error=parentheses -Wno-error=unused-function -Wno-error=unused-label -Wno-error=switch -Wno-error=tautological-compare -Wno-error=memset-elt-size -Wno-error=misleading-indentation -Wno-error=sizeof-pointer-memaccess -Wno-error=stringop-truncation -Wno-error=address-of-packed-member -Wno-error=pointer-to-int-cast -Wno-error=int-to-pointer-cast -Wno-error=stringop-overread -Wno-error=stringop-overflow -Wno-error=array-bounds -Wno-error=unused-result -Wno-error=missing-braces -Wno-error=builtin-declaration-mismatch -Wno-error=ignored-optimization-argument -Wno-ignored-optimization-argument -Wno-error=unknown-warning-option -Wno-unknown-warning-option -Wno-error=unused-command-line-argument -Wno-unused-command-line-argument"
          set +e
          # 彻底清掉 GCC 专有优化 flag（clang 不认识，MTK Makefile 里塞的）
          for f in $(grep -rl -- '-fmerge-constants' . --include=Makefile --include='*.mk' --include=Kbuild 2>/dev/null); do
            sed -i 's/-fmerge-constants//g' "$f"
            echo "  [fix] 去 -fmerge-constants: $f"
          done
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               CC="clang --target=aarch64-linux-gnu" \
               LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
               -j$(nproc) Image.gz KCFLAGS="$KCF" > /tmp/build.log 2>&1
          RC=$?
          set -e
          echo "=== BUILD EXIT: $RC ==="
          echo "=== error 行（最多 80） ==="
          grep -E "error:|fatal error:" /tmp/build.log | head -80 || true
          echo "=== 最后 25 行 ==="
          tail -25 /tmp/build.log || true
          echo "=== out/arch/arm64/boot ==="
          ls -la out/arch/arm64/boot/ 2>&1 | head -20 || true

          # ★ 门禁：vermagic 必须与原厂逐字一致，否则产出物会变砖
          if [ "$RC" -eq 0 ] && [ -f out/arch/arm64/boot/Image ]; then
            echo "=== VERMAGIC 门禁 ==="
            VM=$(strings -a out/arch/arm64/boot/Image | grep -m1 'SMP.*mod_unload' || echo "")
            echo "  实际: [$VM]"
            echo "  期望: [4.19.191+ SMP preempt mod_unload modversions aarch64]"
            if [ "$VM" = "4.19.191+ SMP preempt mod_unload modversions aarch64" ]; then
              echo "  [PASS] vermagic 与原厂一致"
            else
              echo "  [FAIL] vermagic 不符 —— 这份镜像刷了会变砖，中止"
              exit 1
            fi
          fi

          if [ "$RC" -ne 0 ]; then exit 1; fi

      - name: Package
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cd out/arch/arm64/boot 2>/dev/null || { echo "no boot dir"; exit 0; }
          if [ -f Image.gz ]; then
            cp Image.gz "$GITHUB_WORKSPACE/artifacts/kernel_Image.gz"; echo "used Image.gz"
          elif [ -f Image ]; then
            gzip -9 -c Image > "$GITHUB_WORKSPACE/artifacts/kernel_Image.gz"; echo "gzipped Image"
            cp Image "$GITHUB_WORKSPACE/artifacts/kernel_Image.raw"
          else
            echo "!! 无内核镜像"
          fi
          ls -la "$GITHUB_WORKSPACE/artifacts/" || true
          cp "$GITHUB_WORKSPACE/out/.config" "$GITHUB_WORKSPACE/artifacts/kernel.config" 2>/dev/null || true
          cp System.map "$GITHUB_WORKSPACE/artifacts/kernel.System.map" 2>/dev/null || true
          cp /tmp/build.log "$GITHUB_WORKSPACE/artifacts/build.log" 2>/dev/null || true
          # ★ 把 module_layout 的 CRC 带出来 —— 这是 vendor .ko 能否加载的唯一判据
          # 原厂 ko 的 __versions 段里存着它期望的 CRC；内核 CRC 不一致就报
          # "disagrees about version of symbol module_layout" → Exec format error
          cp "$GITHUB_WORKSPACE/out/Module.symvers" "$GITHUB_WORKSPACE/artifacts/Module.symvers" 2>/dev/null || true
          echo "=== module_layout CRC (关键校验值) ==="
          grep -iE '\bmodule_layout\b' "$GITHUB_WORKSPACE/out/Module.symvers" 2>/dev/null || echo "(Module.symvers 里没找到 module_layout)"
          echo "=== 全部导出符号数 ==="
          wc -l "$GITHUB_WORKSPACE/out/Module.symvers" 2>/dev/null || true

          # ★★★ 探针：量 sizeof(struct module) ★★★
                    echo ""
          echo "=== 探针A：wlan 驱动源码在不在树里 ==="
          for d in \
            drivers/misc/mediatek/connectivity/wlan \
            drivers/misc/mediatek/connectivity/wlan/gen4m \
            drivers/misc/mediatek/connectivity/wlan/core \
            drivers/misc/mediatek/connectivity/common \
            ../vendor/oplus/kernel/connectivity \
            ; do
            if [ -d "$d" ]; then
              echo "  [有] $d  ($(find "$d" -name '*.c' 2>/dev/null | wc -l) 个 .c)"
            else
              echo "  [无] $d"
            fi
          done
          echo "--- 全树搜 wlan 相关 .c ---"
          find . ../vendor -name '*wlan*' -name '*.c' 2>/dev/null | head -15
          echo "--- 全树搜 gl_/wlan driver 关键函数 ---"
          grep -rl 'glRegisterWlan' . ../vendor --include=*.c 2>/dev/null | head -5

          echo ""
          echo "=== 探针B：原厂 ko 里哪些符号 CRC 变了（关键结论）==="
          echo "（这决定能否靠重编 ko 修复）"

          # ★★★ 探针：量 sizeof(struct module) ★★★
          export PATH="$CLANG_DIR/bin:$PATH"
          PROBE=/tmp/probe
          rm -rf "$PROBE"; mkdir -p "$PROBE"
          # 用 base64 写文件，绕开 YAML heredoc 缩进问题（这个项目的老坑）
          echo 'I2luY2x1ZGUgPGxpbnV4L21vZHVsZS5oPgojaW5jbHVkZSA8bGludXgva2VybmVsLmg+Ck1PRFVMRV9MSUNFTlNFKCJHUExJIik7CnN0YXRpYyBpbnQgX19pbml0IHBfaW5pdCh2b2lkKSB7IHJldHVybiAwOyB9CnN0YXRpYyB2b2lkIF9fZXhpdCBwX2V4aXQodm9pZCkgeyB9Cm1vZHVsZV9pbml0KHBfaW5pdCk7Cm1vZHVsZV9leGl0KHBfZXhpdCk7Cg==' | base64 -d > "$PROBE/probe.c"
          echo 'b2JqLW0gOj0gcHJvYmUubwo=' | base64 -d > "$PROBE/Makefile"
          cat "$PROBE/probe.c"
          make -C "$GITHUB_WORKSPACE/out" M="$PROBE" \
               ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
               CC="clang --target=aarch64-linux-gnu" \
               LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
               modules 2>&1 | tail -5 || echo "(probe 编译失败)"
          if [ -f "$PROBE/probe.ko" ]; then
            cp "$PROBE/probe.ko" "$GITHUB_WORKSPACE/artifacts/probe.ko"
            echo "--- probe.ko 的 this_module 段大小（关键！应为 1024）---"
            (llvm-readelf -S -W "$PROBE/probe.ko" 2>/dev/null || readelf -S -W "$PROBE/probe.ko") | grep -i 'this_module'
          else
            echo "(probe.ko 没生成)"
          fi

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: artifacts/
          if-no-files-found: warn
