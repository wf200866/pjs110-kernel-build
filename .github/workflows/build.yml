name: Build PJS110 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: oppo-source/android_kernel_oppo_mt6833
          ref: oppo/mt6833_t_13.1.1_a2x_5g

      - name: Download OPPO vendor modules
        run: |
          PARENT=$(dirname "$GITHUB_WORKSPACE")
          cd "$PARENT"
          curl -L -o vendor.tar.gz https://github.com/wf200866/pjs110-kernel-build/releases/download/vendor-v1/vendor.tar.gz
          tar xzf vendor.tar.gz
          rm -f vendor.tar.gz
          cd "$GITHUB_WORKSPACE"
          ls kernel/sched_assist/Kconfig && echo "SYMLINK_OK"
          # OPPO 的 vendor 代码里用 ../../../../kernel-4.19/ 相对路径引用内核自身，造这个链接
          cd "$PARENT"
          if [ ! -e kernel-4.19 ]; then
            ln -s "$(basename "$GITHUB_WORKSPACE")" kernel-4.19
            echo "=== created kernel-4.19 symlink ==="
          fi
          ls -la kernel-4.19/ | head -3
          cd "$GITHUB_WORKSPACE"

      - name: Download stock config
        run: |
          curl -L -o /tmp/stock.config https://github.com/wf200866/pjs110-kernel-build/releases/download/vendor-v1/pjs110_stock.config
          wc -l /tmp/stock.config

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make libncurses-dev flex bison libssl-dev bc gcc-aarch64-linux-gnu

      - name: Prepare config
        run: |
          # 先删掉 OPPO 开源缺失的 Kconfig 引用（无论用哪种 config 都要删）
          sed -i '/cpu_jankinfo\/Kconfig/d' fs/proc/Kconfig
          echo "=== fixed missing Kconfig refs ==="
          # 修复 OPPO 头文件的 inline 声明（函数体在 .c 里，gcc 报 always_inline 错）
          sed -i 's/^extern inline bool handle_chp_ext_cmd/extern bool handle_chp_ext_cmd/' include/linux/mm.h
          sed -i 's/^inline void uclamp_se_set/extern void uclamp_se_set/' kernel/sched/sched.h
          sed -i 's/^inline void ksm_flock/extern void ksm_flock/' include/linux/keyslot-manager.h
          sed -i 's/^inline void blk_crypto_flock/extern void blk_crypto_flock/' include/linux/blk-crypto.h
          sed -i 's/^inline void ksm_flock/extern void ksm_flock/' include/linux/keyslot-manager.h
          sed -i 's/^extern inline bool is_audio_task/extern bool is_audio_task/' include/linux/sched_assist/sched_assist_binder.h 2>/dev/null || true
          sed -i 's/^inline bool oplus_ofp_is_support/extern bool oplus_ofp_is_support/' drivers/gpu/drm/oplus/oplus_display_onscreenfingerprint.h 2>/dev/null || true
          echo "=== inline decls fixed ==="
          # 造 OPPO 缺失头文件的桩（oppo_process.h）
          mkdir -p include/soc/oplus/system
          printf '%s\n' \
            '#ifndef _OPPO_PROCESS_H_' \
            '#define _OPPO_PROCESS_H_' \
            '#include <linux/types.h>' \
            'struct pid;' \
            'static inline bool oppo_is_android_core_group(struct pid *pgrp) { return false; }' \
            '#endif' > include/soc/oplus/system/oppo_process.h
          # oppo_project.h 也缺（flashlight 等驱动用到）
          printf '%s\n' \
            '#ifndef _OPPO_PROJECT_H_' \
            '#define _OPPO_PROJECT_H_' \
            '#include <linux/types.h>' \
            'static inline int get_project(void) { return 20015; }' \
            'static inline int get_PCB_Version(void) { return 0; }' \
            '#endif' > include/soc/oplus/system/oppo_project.h
          echo "=== oppo_process.h + oppo_project.h stubs created ==="
          # 修 oplus_sy6529.c 的 | 优先级问题（-Werror=parentheses 无法通过 KCFLAGS 压制）
          SY6529="$(dirname "$GITHUB_WORKSPACE")/vendor/oplus/kernel/charger/v1/voocphy/oplus_sy6529.c"
          if [ -f "$SY6529" ]; then
            sed -i 's/if (\*data == sy6529_CHARGE_MODE_2_1 | \*data == sy6529_CHARGE_MODE_1_1)/if ((*data == sy6529_CHARGE_MODE_2_1) | (*data == sy6529_CHARGE_MODE_1_1))/' "$SY6529"
            echo "=== fixed sy6529 parentheses ==="
          fi
          # touch.c 用到 TP_VXN 但 vendor 的 tp_devices.h 没定义（OPPO 源码版本不一致）
          TPDEV="$(dirname "$GITHUB_WORKSPACE")/vendor/oplus/kernel/touchpanel/oplus_touchscreen/tp_devices.h"
          echo "TPDEV=$TPDEV"
          if [ -f "$TPDEV" ] && ! grep -q "TP_VXN" "$TPDEV"; then
            sed -i 's/^    TP_TXD,/    TP_TXD,\n    TP_VXN,/' "$TPDEV"
            echo "=== added TP_VXN ==="
          fi
          grep -c "TP_VXN" "$TPDEV" 2>/dev/null || echo "TPDEV not found"
          sed -i 's/^extern inline unsigned long zram_page_state/extern unsigned long zram_page_state/' drivers/block/zram/zram_drv_internal.h 2>/dev/null || true
          sed -i 's/^extern inline bool is_thp_zram/extern bool is_thp_zram/' drivers/block/zram/zram_drv_internal.h 2>/dev/null || true
          grep -n "zram_page_state\|is_thp_zram" drivers/block/zram/zram_drv_internal.h 2>/dev/null | head -2
          cp /tmp/stock.config out.config
          printf '\nCONFIG_SYSVIPC=y\nCONFIG_SYSVIPC_SYSCTL=y\nCONFIG_IPC_NS=y\nCONFIG_USER_NS=y\nCONFIG_CGROUP_PIDS=y\nCONFIG_DEVTMPFS=y\nCONFIG_DEVTMPFS_MOUNT=y\nCONFIG_POSIX_MQUEUE=y\n' >> out.config
          sed -i 's/^CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/' out.config
          sed -i 's/^CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/' out.config
          sed -i 's/^CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/' out.config
          echo "=== check ==="
          grep -E "^CONFIG_(SYSVIPC|IPC_NS|USER_NS|CGROUP_PIDS|DEVTMPFS)=" out.config
          grep -E "^# CONFIG_MODULE_SIG" out.config

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p out
          cp out.config out/.config
          # 直接编译，不跑 olddefconfig（原厂 config 可能含 OPPO 特有 symbol，olddefconfig 会因缺失 Kconfig 报错）
          make O=out ARCH=arm64 -j$(nproc) Image.gz KCFLAGS="-Wno-error -Wno-error=strict-prototypes -Wno-error=return-type -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=incompatible-pointer-types -Wno-error=format -Wno-error=format-extra-args -Wno-error=format-overflow -Wno-error=format-truncation -Wno-error=deprecated-declarations -Wno-error=unused-but-set-variable -Wno-error=unused-variable -Wno-error=unused-value -Wno-error=missing-prototypes -Wno-error=old-style-definition -Wno-error=int-conversion -Wno-error=declaration-after-statement -Wno-error=inline -Wno-error=maybe-uninitialized -Wno-error=parentheses -Wno-error=unused-function -Wno-error=unused-label -Wno-error=switch -Wno-error=tautological-compare -Wno-error=memset-elt-size -Wno-error=misleading-indentation -Wno-error=sizeof-pointer-memaccess -Wno-error=stringop-truncation -Wno-error=address-of-packed-member -Wno-error=pointer-to-int-cast -Wno-error=int-to-pointer-cast -Wno-error=stringop-overread -Wno-error=stringop-overflow -Wno-error=array-bounds -Wno-error=unused-result"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz