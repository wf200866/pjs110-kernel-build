name: Build PJS110 Kernel (Droidspaces + vendor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: oppo-source/android_kernel_oppo_mt6833
          ref: oppo/mt6833_t_13.1.1_a2x_5g

      - name: Download OPPO vendor modules
        run: |
          # vendor 必须放在内核源码的兄弟目录（symlink 用 ../../vendor 相对路径）
          PARENT=$(dirname "$GITHUB_WORKSPACE")
          cd "$PARENT"
          curl -L -o vendor.tar.gz https://github.com/wf200866/pjs110-kernel-build/releases/download/vendor-v1/vendor.tar.gz
          tar xzf vendor.tar.gz
          rm -f vendor.tar.gz
          echo "vendor 放在: $PARENT/vendor"
          ls "$PARENT/vendor/oplus/kernel/oplus_performance/sched_assist/" | head -5
          # 验证 symlink 能解析
          cd "$GITHUB_WORKSPACE"
          ls kernel/sched_assist/Kconfig && echo "SYMLINK_OK" || echo "SYMLINK_BROKEN"

      - name: Install cross toolchain (gcc-11, more tolerant of legacy code)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make libncurses-dev flex bison libssl-dev bc

      - name: Apply Droidspaces config
        run: |
          DEF=arch/arm64/configs/k6833v1_64_k419_defconfig
          cat >> $DEF << 'EOF'

          # DroidSpaces (non-GKI 4.19)
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_IPV6=y
          CONFIG_IPV6_MULTIPLE_TABLES=y
          CONFIG_IP6_NF_IPTABLES=y
          CONFIG_IP6_NF_FILTER=y
          CONFIG_IP6_NF_MANGLE=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_NF_CONNTRACK_IPV6=y
          CONFIG_NF_NAT_IPV6=y
          CONFIG_MACVLAN=y
          CONFIG_USER_NS=y
          EOF

          # 关闭模块签名强制校验（vendor .ko 用 OPPO 私钥签，我们签不了）
          sed -i 's/CONFIG_MODULE_SIG=y/CONFIG_MODULE_SIG=n/' $DEF
          sed -i 's/CONFIG_MODULE_SIG_FORCE=y/CONFIG_MODULE_SIG_FORCE=n/' $DEF
          sed -i 's/CONFIG_MODULE_SIG_ALL=y/CONFIG_MODULE_SIG_ALL=n/' $DEF

          # 终极方案：关掉 OPLUS_BUG_* 系列（这些是 OPPO 稳定性监控，源码不全且与 Droidspaces 无关）
          if [ -f oplus_native_features.mk ]; then
            cp oplus_native_features.mk oplus_native_features.mk.bak
            # 关闭所有 OPLUS_BUG_* 开关（Bug 稳定性监控，会引入缺失的闭源头文件）
            sed -i -E 's/^(OPLUS_BUG_[A-Z_]+)=(yes|y|true)/\1=no/' oplus_native_features.mk
            # 关闭已知会导致源码缺失的模块
            for k in OPLUS_FEATURE_SCHED_ASSIST OPLUS_FEATURE_CPU_JANKINFO OPLUS_FEATURE_TASK_CPUSTATS \
                     OPLUS_FEATURE_MEMLEAK_DETECT OPLUS_FEATURE_LOWMEM_DBG OPLUS_FEATURE_HEALTHINFO \
                     OPLUS_FEATURE_SECURE_GUARD OPLUS_FEATURE_SECURE_ROOTGUARD \
                     OPLUS_FEATURE_SECURE_MOUNTGUARD OPLUS_FEATURE_SECURE_EXECGUARD \
                     OPLUS_FEATURE_IOMONITOR; do
              sed -i -E "s/^(${k})=(yes|y|true)/\1=no/" oplus_native_features.mk
            done
            echo "=== 已关闭的 OPLUS 开关 ==="
            grep -E "^OPLUS_BUG_|^OPLUS_FEATURE_(SCHED_ASSIST|CPU_JANKINFO|MEMLEAK)" oplus_native_features.mk | head -8
          fi

          # 删掉 OPPO 开源漏掉的 cpu_jankinfo Kconfig 引用（这个文件 vendor 里也没有）
          sed -i '/cpu_jankinfo\/Kconfig/d' fs/proc/Kconfig

          # 关掉 HYBRIDSWAP（vendor 里 struct hybridswapd_operations 定义不全）
          sed -i -E 's/^CONFIG_HYBRIDSWAP(=y|=m)/# CONFIG_HYBRIDSWAP is not set/' $DEF
          sed -i -E 's/^CONFIG_HYBRIDSWAP_[A-Z_]*(=y|=m)/# & is not set/' $DEF
          sed -i -E 's/^(OPLUS_FEATURE_HYBRIDSWAP)=(yes|y|true)/\1=no/' oplus_native_features.mk 2>/dev/null || true
          # 直接从 zram Makefile 里摘掉 hybridswap 编译目标（彻底避免）
          if [ -f drivers/block/zram/Makefile ]; then
            sed -i 's|obj-$(CONFIG_HYBRIDSWAP).*hybridswap.*|# hybridswap removed for build|' drivers/block/zram/Makefile
            sed -i '/hybridswap/d' drivers/block/zram/Makefile
            echo "hybridswap refs removed from zram Makefile"
            cat drivers/block/zram/Makefile | head -10
          fi

          # 关掉 OPLUS 稳定性/性能模块（OPPO 开源时漏了对应源码文件，会导致编译失败）
          # 这些跟 Droidspaces 功能无关
          for c in OPLUS_SYSTEM_KERNEL OPLUS_FEATURE_OPROJECT OPLUS_FEATURE_FEEDBACK \
                   OPLUS_DEVICE_IFNO OPLUS_FEATURE_THEIA OPLUS_FEATURE_SHUTDOWN_DETECT \
                   OPLUS_FEATURE_PHOENIX OPLUS_FEATURE_OLC OPLUS_FEATURE_FDLEAK_CHECK \
                   OPLUS_FEATURE_LAST_BOOT_REASON OPLUS_FEATURE_MTK_FORCE_SHUTDOWN \
                   OPLUS_FEATURE_KMSG_WB OPLUS_FEATURE_PANIC_FLUSH \
                   OPLUS_FEATURE_UID_PERF CONT_PTE_HUGEPAGE HYBRIDSWAP \
                   OPLUS_FEATURE_SCHED_ASSIST OPLUS_SECURE_GUARD OPLUS_HEALTHINFO \
                   OPLUS_FEATURE_CPU_JANKINFO OPLUS_FEATURE_TASK_CPUSTATS \
                   OPLUS_FEATURE_MEMLEAK_DETECT OPLUS_FEATURE_LOWMEM_DBG; do
            sed -i "s/^CONFIG_${c}=y/# CONFIG_${c} is not set/" $DEF
            sed -i "s/^CONFIG_${c}=m/# CONFIG_${c} is not set/" $DEF
          done

          # 关掉 IKHEADERS（避免 cross 环境 cpio 问题）
          echo "# CONFIG_IKHEADERS is not set" >> $DEF

          # 补齐 OPPO 开源遗漏的头文件（造最小桩，避免编译中断）
          mkdir -p include/soc/oplus/system
          printf '%s\n' \
            '#ifndef _OPPO_PROCESS_H_' \
            '#define _OPPO_PROCESS_H_' \
            '#include <linux/types.h>' \
            'struct pid;' \
            'static inline bool oppo_is_android_core_group(struct pid *pgrp) { return false; }' \
            '#endif' > include/soc/oplus/system/oppo_process.h
          echo "created oppo_process.h stub"
          head -3 include/soc/oplus/system/oppo_process.h

          # 修 sched_assist_binder.h 的 extern inline 声明（函数体在 .c 里）
          sed -i 's/^extern inline bool is_audio_task/extern bool is_audio_task/' include/linux/sched_assist/sched_assist_binder.h 2>/dev/null || true
          grep -n "is_audio_task" include/linux/sched_assist/sched_assist_binder.h 2>/dev/null | head -2

          # 修 OPPO 头文件的 extern inline 声明问题（函数体在别处，gcc-11 报 always_inline 错误）
          sed -i 's/^extern inline bool handle_chp_ext_cmd/extern bool handle_chp_ext_cmd/' include/linux/mm.h
          sed -i 's/^inline void uclamp_se_set/extern void uclamp_se_set/' kernel/sched/sched.h
          sed -i 's/^static inline.*ksm_flock/extern void ksm_flock/' include/linux/keyslot-manager.h
          # 兜底：把 keyslot-manager.h 里的 inline 声明统一去掉（该函数体在 security/keys 里）
          sed -i 's/^inline void ksm_flock/extern void ksm_flock/' include/linux/keyslot-manager.h

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out \
            k6833v1_64_k419_defconfig
          grep -E "CONFIG_SYSVIPC|CONFIG_OVERLAY_FS|CONFIG_USER_NS|CONFIG_MODULE_SIG" out/.config
          make O=out -j$(nproc) WERROR=0 \
            KCFLAGS="-Wno-error -fgnu89-inline -Wno-error=strict-prototypes -Wno-error=deprecated-declarations -Wno-error=incompatible-pointer-types -Wno-error=return-type -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=main -Wno-error=unused-but-set-variable -Wno-error=unused-variable -Wno-error=missing-prototypes -Wno-error=old-style-definition -Wno-error=int-conversion -Wno-error=declaration-after-statement -Wno-error=inline -Wno-error=format -Wno-error=format-extra-args -Wno-error=format-overflow"

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz